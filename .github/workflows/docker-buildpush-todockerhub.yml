name: ci

on:
  push:
    branches: [ main ]
    tags: [ '*.*.*' ]
  workflow_dispatch:

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      release_tag: ${{ steps.gate.outputs.release_tag }}
    steps:
      -
        name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Decide whether to build
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          latest_matching_tag="$(git tag -l '*.*.*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          should_build="false"
          release_tag=""

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_build="true"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$tag" == "$latest_matching_tag" ]]; then
              should_build="true"
              release_tag="$tag"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            head_matching_tags="$(git tag --points-at "$GITHUB_SHA" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
            if [[ -n "$latest_matching_tag" ]] && printf '%s\n' "$head_matching_tags" | grep -Fxq "$latest_matching_tag"; then
              should_build="false"
            else
              should_build="true"
            fi
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: precheck
    if: ${{ needs.precheck.outputs.should_build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_pair: amd64
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - 
        name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          tags: |
            hammadrauf/jupyter-notebook
            quay.io/hammadrauf/jupyter-notebook
            ghcr.io/hammadrauf/jupyter-notebook
          file: ./Containerfile
      -
        name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      -
        name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform_pair }}
          path: /tmp/digests/*

  merge:
    runs-on: ubuntu-latest
    needs: [precheck, build]
    if: ${{ needs.precheck.outputs.should_build == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      -
        name: Create multi-arch manifests
        env:
          RELEASE_TAG: ${{ needs.precheck.outputs.release_tag }}
        run: |
          set -euo pipefail
          digests="$(printf 'sha256:%s ' /tmp/digests/* | sed 's#/tmp/digests/##g')"

          docker buildx imagetools create -t hammadrauf/jupyter-notebook:latest $digests
          docker buildx imagetools create -t quay.io/hammadrauf/jupyter-notebook:latest $digests
          docker buildx imagetools create -t ghcr.io/hammadrauf/jupyter-notebook:latest $digests

          if [[ -n "$RELEASE_TAG" ]]; then
            docker buildx imagetools create -t hammadrauf/jupyter-notebook:${RELEASE_TAG} $digests
            docker buildx imagetools create -t quay.io/hammadrauf/jupyter-notebook:${RELEASE_TAG} $digests
            docker buildx imagetools create -t ghcr.io/hammadrauf/jupyter-notebook:${RELEASE_TAG} $digests
          fi